services:
  db:
    image: postgres:18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retrise: 5
  migrate:
    build: .
    command: npm run migrate
    depends_on:
      db:
        condition: servere_healthy
  app:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: run 
    

