services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432" 
    volumes:
      - postgres_data:/var/lib/postgresql/data #для сохранений данных после перезагрузки bd
    environment:
      POSTGRES_USER: postgres 
      POSTGRES_PASSWORD: "100" 
      DATABASE_URL: postgres://postgres:100@db:5432/schedule_db?sslmode=disable
    healthcheck: #  Автоматически проверяет работаспособность приложения внутри контейнера 
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  migrate:
    build: .
    command: ./migrate_tool
    environment:
      OSTGRES_USER: postgres 
      POSTGRES_PASSWORD: "100" 
      DATABASE_URL: postgres://postgres:100@db:5432/schedule_db?sslmode=disable
    depends_on: #ждет пока выполниться bd
      db:
        condition: service_healthy
  app:
    build: .
    ports:
      - "5050:5050"
    environment:
      OSTGRES_USER: postgres 
      POSTGRES_PASSWORD: "100" 
      DATABASE_URL: postgres://postgres:100@db:5432/schedule_db?sslmode=disable
    depends_on:  #ждет пока выполниться мигратор
      migrate:
        condition: service_completed_successfully 
volumes:
    postgres_data:
